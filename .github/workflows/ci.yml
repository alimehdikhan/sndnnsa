name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Lint and format (ruff)
        working-directory: backend
        run: ruff check . ../api && ruff format --check . ../api
      - name: Type-check (mypy)
        working-directory: backend
        run: mypy
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Performance budget: fails if initial JS exceeds 180 KB gzipped.
      - run: npm run size
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  lighthouse:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      # The API serves the built frontend and the committed data snapshot (backend/data).
      - name: Start the app
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Targets on the Decision view: performance >= 95, LCP < 1.5 s, CLS < 0.05, TBT < 150 ms.
      - run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Playwright starts the API, which serves the built frontend (playwright.config.ts).
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gb-wind-forecast .
      # Smoke test the image: healthy, serves the snapshot, the UI and a deep link.
      - name: Run the image
        run: |
          docker run -d --name app -e PORT=8080 -p 8080:8080 gb-wind-forecast
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
          curl -sf http://localhost:8080/api/dataset -o /dev/null
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf "http://localhost:8080/accuracy?mode=horizon&h=12" | grep -q '<div id="root">'
          docker compose config --quiet
      - if: failure()
        run: docker logs app
