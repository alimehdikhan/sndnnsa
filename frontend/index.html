<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="GB wind generation forecast (Elexon WINDFOR) against actual outturn (FUELHH) for January 2026: gate-closure replay and month-long accuracy." />
    <title>GB Wind Forecast Monitor</title>
    <script>
      // Apply the stored theme before first paint (dark unless the viewer chose light).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
